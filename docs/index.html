<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Flash Catalog</title>
<style>
  :root { --bg:#f4f6f8; --fg:#1d2733; --card:#fff; --accent:#1565c0; --muted:#5b6b7b; --line:#d5dde5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10161c; --fg:#e6edf3; --card:#18212a; --accent:#64b5f6; --muted:#9fb0c0; --line:#2a3744; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:22px; margin:8px 0 4px; }
  p { margin:8px 0; }
  .muted { color:var(--muted); font-size:14px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:14px 0; }
  a.btn { display:block; text-align:center; text-decoration:none; padding:13px 14px; margin:10px 0; border-radius:10px; font-weight:600; border:2px solid var(--accent); color:var(--accent); }
  a.btn.primary { background:var(--accent); color:#fff; }
  @media (prefers-color-scheme: dark) { a.btn.primary { color:#0b1620; } }
  a.btn[hidden] { display:none; }
  ol { padding-left:20px; margin:6px 0; }
</style>
</head>
<body>
<main>
  <h1>Flash Catalog</h1>
  <p id="lead" class="muted"></p>

  <div class="box">
    <a id="open" class="btn primary" href="#" hidden></a>
    <a id="web" class="btn" href="#" hidden></a>
    <a id="apk" class="btn" href="https://github.com/novistetua/android-flash-catalog/releases/latest/download/FlashCatalog.apk"></a>
    <p id="hint" class="muted"></p>
  </div>

  <div class="box">
    <p id="howtitle"><b></b></p>
    <ol id="how"></ol>
  </div>

  <p class="muted" id="priv"></p>
</main>
<script>
(function () {
  var ru = (navigator.language || "ru").toLowerCase().indexOf("ru") === 0;
  var T = ru ? {
    lead: "Каталог флешек и карт памяти: фото, аннотации, обмен между устройствами.",
    open: "Открыть в приложении Flash Catalog",
    apk: "Скачать приложение для Android (APK)",
    webCroc: "Получить карточки в браузере (через croc)",
    webLan: "Скачать карточки в браузере (по Wi‑Fi)",
    hintApp: "Если приложение установлено, кнопка выше откроет его и сразу начнёт приём. Если нет, откроется страница загрузки: скачай APK, установи (Android попросит разрешить установку из этого источника), затем отсканируй QR уже в приложении (кнопка QR → Получить).",
    hintNone: "Эта ссылка не содержит данных обмена. Открой её, отсканировав QR из приложения.",
    hintNoWeb: "Отправитель не включил скачивание в браузере. Нужно приложение.",
    hintDesk: "На компьютере открой этот QR на телефоне с Android, или попроси отправителя дать веб-ссылку.",
    howtitle: "Как это работает",
    how: ["Отправитель в приложении показывает QR.", "Любой сканер откроет эту страницу.", "Кнопки выше: открыть в приложении, скачать приложение или скачать карточки в браузере."],
    priv: "Данные обмена лежат в части адреса после «#». Браузер не отправляет её на сервер, страница ничего никуда не передаёт."
  } : {
    lead: "A catalog of flash drives and memory cards: photos, notes, device-to-device exchange.",
    open: "Open in the Flash Catalog app",
    apk: "Download the Android app (APK)",
    webCroc: "Receive the cards in the browser (via croc)",
    webLan: "Download the cards in the browser (over Wi-Fi)",
    hintApp: "If the app is installed, the button above opens it and starts receiving. Otherwise a download page opens: get the APK, install it (Android will ask to allow installs from this source), then scan the QR again inside the app (QR button, then Receive).",
    hintNone: "This link carries no transfer data. Open it by scanning a QR code from the app.",
    hintNoWeb: "The sender did not enable browser download. The app is required.",
    hintDesk: "On a computer, open this QR on an Android phone, or ask the sender for a web link.",
    howtitle: "How it works",
    how: ["The sender shows a QR code in the app.", "Any scanner opens this page.", "Use the buttons: open in the app, install the app, or download the cards in the browser."],
    priv: "The transfer data lives after the # in the address. Browsers never send it to a server, and this page does not transmit it anywhere."
  };
  document.documentElement.lang = ru ? "ru" : "en";
  document.getElementById("lead").textContent = T.lead;
  document.getElementById("apk").textContent = T.apk;
  document.querySelector("#howtitle b").textContent = T.howtitle;
  document.getElementById("priv").textContent = T.priv;
  var ol = document.getElementById("how");
  T.how.forEach(function (s) { var li = document.createElement("li"); li.textContent = s; ol.appendChild(li); });

  var h = decodeURIComponent((location.hash || "").slice(1));
  var open = document.getElementById("open");
  var web = document.getElementById("web");
  var hint = document.getElementById("hint");
  var isAndroid = /android/i.test(navigator.userAgent);
  var releases = "https://github.com/novistetua/android-flash-catalog/releases/latest";

  var kind = h.indexOf("fcroc1?") === 0 ? "croc" : (h.indexOf("fcat1?") === 0 ? "lan" : "");
  if (!kind) { hint.textContent = T.hintNone; return; }

  // ссылка на приложение: схема fcat://, при отсутствии приложения Chrome откроет страницу загрузки
  if (isAndroid) {
    open.href = "intent://r?p=" + encodeURIComponent(h) +
      "#Intent;scheme=fcat;package=com.novis.flashcatalog;S.browser_fallback_url=" + encodeURIComponent(releases) + ";end";
    open.textContent = T.open;
    open.hidden = false;
    hint.textContent = T.hintApp;
  } else {
    hint.textContent = T.hintDesk;
  }

  if (kind === "croc") {
    var code = new URLSearchParams(h.slice(h.indexOf("?") + 1)).get("c");
    if (code) {
      web.href = "https://getcroc.com/?code=" + encodeURIComponent(code);
      web.textContent = T.webCroc;
      web.hidden = false;
    }
  } else {
    var w = new URLSearchParams(h.slice(h.indexOf("?") + 1)).get("w");
    if (w && /^http:\/\//.test(w)) {
      web.href = w;
      web.textContent = T.webLan;
      web.hidden = false;
    } else {
      hint.textContent += " " + T.hintNoWeb;
    }
  }
})();
</script>
</body>
</html>
