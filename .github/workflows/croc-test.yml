name: croc test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build croc and test
        run: |
          set +e
          W=$PWD
          {
          export GOBIN=$W/bin
          CGO_ENABLED=0 go install github.com/schollz/croc/v10@latest
          bin/croc --version
          unset GOBIN
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go install -ldflags="-s -w" github.com/schollz/croc/v10@latest
          A=$(find $(go env GOPATH)/bin -name croc -path '*arm64*' | head -1)
          echo "ARM: $A"; ls -la $A; file $A
          echo ---- TEST
          mkdir -p $W/t/send $W/t/recv
          echo hello-croc > $W/t/send/a.txt
          (cd $W; bin/croc relay --ports 9009,9010,9011,9012,9013 > $W/relay.log 2>&1 &)
          sleep 3
          cd $W/t/send
          (CROC_SECRET=1234-alpha-beta-gamma $W/bin/croc --ignore-stdin --relay 127.0.0.1:9009 --pass pass123 send --no-local a.txt < /dev/null > $W/send.log 2>&1 &)
          sleep 4
          cd $W/t/recv
          CROC_SECRET=1234-alpha-beta-gamma timeout 60 $W/bin/croc --ignore-stdin --yes --overwrite --out $W/t/recv --relay 127.0.0.1:9009 --pass pass123 < /dev/null 2>&1
          echo "recv exit=$?"
          ls -la $W/t/recv
          cat $W/t/recv/a.txt
          echo ---- SEND LOG
          cat $W/send.log
          echo ---- RELAY LOG
          cat $W/relay.log
          } > /tmp/croc-test.log 2>&1
          cat /tmp/croc-test.log
          cd $W
          git config user.name ci
          git config user.email ci@example.com
          git checkout --orphan croclog
          git rm -rf . -q
          cp /tmp/croc-test.log croc-test.log
          git add croc-test.log
          git commit -q -m "croc log"
          git push -f origin croclog
