name: croc test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build croc and test
        run: |
          set +e
          {
          export GOBIN=$PWD/bin
          go version
          CGO_ENABLED=0 go install github.com/schollz/croc/v10@latest
          ls -la bin
          bin/croc --version
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 GOBIN=$PWD/arm go install github.com/schollz/croc/v10@latest 2>&1 | tail -3
          mkdir -p arm; find . -name croc -path '*arm*' -exec ls -la {} \; 
          file $(find . -name croc -path '*linux_arm64*' | head -1)
          echo ---- HELP
          bin/croc --help
          echo ---- SEND HELP
          bin/croc send --help
          echo ---- RELAY HELP
          bin/croc relay --help
          echo ---- TEST
          mkdir -p t/send t/recv
          echo hello-croc > t/send/a.txt
          (bin/croc relay --ports 9009,9010,9011,9012,9013 > relay.log 2>&1 &)
          sleep 3
          cd t/send
          (../../bin/croc --ignore-stdin --no-local --relay 127.0.0.1:9009 --pass pass123 send --code 1234-alpha-beta-gamma a.txt < /dev/null > send.log 2>&1 &)
          sleep 4
          cd ../recv
          CROC_SECRET=1234-alpha-beta-gamma ../../bin/croc --ignore-stdin --no-local --yes --overwrite --out . --relay 127.0.0.1:9009 --pass pass123 < /dev/null 2>&1
          echo "recv exit=$?"
          ls -la
          cat a.txt
          echo ---- SEND LOG
          cat ../send/send.log
          echo ---- RELAY LOG
          cat ../../relay.log
          } > /tmp/croc-test.log 2>&1
          cat /tmp/croc-test.log
          git config user.name ci
          git config user.email ci@example.com
          git checkout --orphan croclog
          git rm -rf . -q
          cp /tmp/croc-test.log croc-test.log
          git add croc-test.log
          git commit -q -m "croc log"
          git push -f origin croclog
