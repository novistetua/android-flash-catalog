name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build wormhole for Android (linux/arm64, static) and smoke-test
        run: |
          git clone --depth 1 --branch v1.0.8 https://github.com/psanford/wormhole-william.git /tmp/ww
          cp tools/zz_dns.go /tmp/ww/zz_dns.go
          cd /tmp/ww
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o /tmp/ww-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o /tmp/ww-arm64 .
          cd $GITHUB_WORKSPACE
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/ww-arm64 app/src/main/jniLibs/arm64-v8a/libwormhole.so
          ls -la app/src/main/jniLibs/arm64-v8a
          # проверка на сервере: отправка и приём через публичные серверы с нашим DNS-патчем
          mkdir -p /tmp/s /tmp/r; echo smoke > /tmp/s/a.txt; cd /tmp/s
          (FC_DNS=1.1.1.1 /tmp/ww-amd64 send a.txt < /dev/null > /tmp/send.log 2>&1 &)
          sleep 8; cat /tmp/send.log
          CODE=$(grep -o 'code is: .*' /tmp/send.log | head -1 | sed 's/code is: //')
          cd /tmp/r; echo y | FC_DNS=1.1.1.1 timeout 60 /tmp/ww-amd64 receive "$CODE" || echo "SMOKE TEST FAILED (не блокирует сборку)"
          ls -la /tmp/r

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish APK to Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk FlashCatalog.apk
          gh release create "build-${{ github.run_number }}" FlashCatalog.apk \
            --title "Flash Catalog, сборка ${{ github.run_number }}" \
            --notes "Автоматическая сборка" --latest

      - name: Save error log to branch buildlog
        if: failure()
        run: |
          tail -n 250 build.log > /tmp/build-tail.log || echo "no log" > /tmp/build-tail.log
          git config user.name ci
          git config user.email ci@example.com
          git checkout --orphan buildlog
          git rm -rf . -q
          cp /tmp/build-tail.log build-tail.log
          git add build-tail.log
          git commit -q -m "build log"
          git push -f origin buildlog
